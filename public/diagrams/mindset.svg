<svg viewBox="0 101 380 141" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="380" height="300" fill="white"/>
<rect x="28" y="109" width="156" height="125" rx="8" fill="#EDEDED"/>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="bold" letter-spacing="0em"><tspan x="91.4497" y="142.5">Fixed</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="68.0654" y="157.636">&#34;Ability is static&#34;</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="57.665" y="174.636">e.g. avoid challenge,&#10;</tspan><tspan x="58.5195" y="190.636">give up at setbacks,&#10;</tspan><tspan x="34.4766" y="206.636">threatened by others&#39; success</tspan></text>
<rect x="196" y="109" width="156" height="125" rx="8" fill="#F4EA66"/>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="bold" letter-spacing="0em"><tspan x="254.095" y="142.5">Growth</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="212.188" y="157.636">&#34;Ability can be developed&#34;</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="217.604" y="174.636">e.g. embrace challenge,&#10;</tspan><tspan x="225.099" y="190.636">persists at setbacks,&#10;</tspan><tspan x="211.632" y="206.636">learn from others&#39; success</tspan></text>
</svg>
