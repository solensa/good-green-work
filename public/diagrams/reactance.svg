<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="70.8027" y="243.5">Push-back</tspan></text>
<text fill="#21293B" font-size="8"><tspan x="23.7461" y="254.909"> Behavioural restoration: defiance, doing </tspan><tspan x="63.6719" y="264.909">the forbidden thing</tspan></text>
