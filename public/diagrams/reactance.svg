<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="161.469" y="172.5">Reactance</tspan></text>
<text fill="#21293B" font-size="8"><tspan x="132.539" y="183.909">arousal to restore the freedom</tspan></text>
