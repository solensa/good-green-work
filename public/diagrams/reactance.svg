<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="135.167" y="123.5">Freedom threatened</tspan></text>
<text fill="#21293B" font-size="8"><tspan x="105.137" y="134.909">surveillance &#xb7; micromanagement &#xb7; &#34;you must&#34;</tspan></text>
