<text fill="#6B6B6B" font-size="10"><tspan x="34" y="49.6364">Brehm, 1966</tspan></text>
<text fill="#595959" font-size="9" font-style="italic"><tspan x="20" y="66.7727">When a freedom feels threatened, motivation arises to restore it - sometimes </tspan><tspan x="20" y="77.7727">by doing exactly the discouraged thing.</tspan></text>
