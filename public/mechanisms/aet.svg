<rect width="380" height="300" rx="10" fill="white"/>
<text fill="black" font-size="15" font-weight="bold"><tspan x="20" y="28.4545">Affective Events Theory (AET)</tspan></text>
<circle cx="24" cy="44" r="4" fill="#EDAE40"/>
<text fill="#6B6B6B" font-size="10"><tspan x="32" y="47.6364">Weiss and Cropanzano, 1996</tspan></text>
<text fill="#595959" font-size="9" font-style="italic"><tspan x="20" y="62.7727">Conditions do not cause feelings directly; they change how often the events </tspan><tspan x="20" y="73.7727">that cause feelings occur. Events arrive several times a day, so without </tspan><tspan x="20" y="84.7727">sampling at a similar frequency, only a lagging, accumulated view is measured.</tspan></text>
