<text fill="black" font-size="11" font-weight="bold"><tspan x="163.155" y="92.5">The event</tspan></text>
<text fill="black" font-size="8"><tspan x="157.383" y="103.909">a demand arrives</tspan></text>
</g>
<g opacity="0.85">
