<text fill="#595959" font-size="9" font-style="italic"><tspan x="147.415" y="62.7727">(1984) </tspan></text>
<text fill="#595959" font-size="9" font-style="italic" font-weight="bold"><tspan x="69.5264" y="62.7727">Appraisal Theory </tspan></text>
<g opacity="0.85">
