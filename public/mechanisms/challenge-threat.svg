<text fill="black" font-size="11" font-weight="bold"><tspan x="142.863" y="130.41">Primary appraisal</tspan></text>
<text fill="black" font-size="8"><tspan x="146.637" y="141.819">does this threaten me?</tspan></text>
</g>
<g opacity="0.85">
<rect x="115" y="153.82" width="150" height="34" rx="4" fill="#F1F1F1"/>
<text fill="black" font-size="11" font-weight="bold"><tspan x="134.78" y="169.32">Secondary appraisal</tspan></text>
<text fill="black" font-size="8"><tspan x="155.734" y="180.73">can I cope with it?</tspan></text>
</g>
