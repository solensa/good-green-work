<text fill="#21293B" font-size="8"><tspan x="244.641" y="241.204">strain, withdraw</tspan></text>
<text fill="#21293B" font-size="8" font-weight="bold"><tspan x="32" y="259.577">&#x2191; cardiac output&#10;</tspan><tspan x="32" y="269.577">&#x2193; peripheral (vascular) resistance</tspan></text>
