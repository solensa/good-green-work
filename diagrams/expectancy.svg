<text fill="white" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="bold" letter-spacing="0em"><tspan x="285.266" y="114">Outcome</tspan></text>
<rect x="20" y="136" width="100" height="60" rx="6" fill="#ECF7DF"/>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="37.2852" y="169.636">&#34;will my effort </tspan><tspan x="45.4199" y="181.636">succeed?&#34;</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" font-weight="bold" letter-spacing="0em"><tspan x="41.1621" y="157.636">Expectancy&#10;</tspan></text>
<rect x="140" y="136" width="100" height="60" rx="6" fill="#ECF7DF"/>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="152.295" y="169.636">&#34;will success be </tspan><tspan x="162.983" y="181.636">rewarded?&#34;</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" font-weight="bold" letter-spacing="0em"><tspan x="152.48" y="157.636">Instrumentality&#10;</tspan></text>
<rect x="260" y="136" width="100" height="60" rx="6" fill="#ECF7DF"/>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="276.094" y="169.636">&#34;do I value the </tspan><tspan x="288.999" y="181.636">reward?&#34;</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" font-weight="bold" letter-spacing="0em"><tspan x="290.278" y="157.636">Valence&#10;</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="bold" letter-spacing="0em"><tspan x="47.6553" y="225.319">Motivation = Expectancy &#xd7; Instrumentality &#xd7; Valence</tspan></text>
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="69.5264" y="244.455">Multiplicative: if any term is zero, motivation is zero</tspan></text>
