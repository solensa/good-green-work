<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="11" font-weight="bold" letter-spacing="0em"><tspan x="61.7368" y="155">Promotion focus</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="69.3154" y="170.136">&#34;playing to win&#34;</tspan></text>
<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="46.1465" y="187.136">Pursues ideals and gains,&#10;</tspan><tspan x="57.3623" y="203.136">seeks advancement,&#10;</tspan><tspan x="61.2246" y="219.136">eager, risk-tolerant</tspan></text>
