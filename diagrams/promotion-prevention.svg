<text fill="#21293B" style="white-space: pre" xml:space="preserve" font-family="Inter" font-size="10" letter-spacing="0em"><tspan x="212.53" y="187.136">Fulfils duties and who one </tspan><tspan x="224.21" y="203.136">ought to be, protects </tspan><tspan x="216.549" y="219.136">security, vigilant, careful</tspan></text>
