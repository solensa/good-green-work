<text fill="black" font-size="15" font-weight="bold"><tspan x="20" y="28.4545">Values-Rewards Fit (V-R Fit)</tspan></text>
<circle cx="24" cy="44" r="4" fill="#EDAE40"/>
<text fill="#6B6B6B" font-size="10"><tspan x="32" y="47.6364">Kalleberg, 1977</tspan></text>
<text fill="#595959" font-size="9" font-style="italic"><tspan x="20" y="62.7727">Sociology&#x2019;s statement of the balance: satisfaction arises when what a worker </tspan><tspan x="20" y="73.7727">values aligns with the rewards the job supplies.</tspan></text>
