<svg viewBox="0 86 380 186" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:Inter,Helvetica,Arial,sans-serif}</style>
<rect width="380" height="300" fill="white"/>
<text fill="black" font-size="15" font-weight="bold"><tspan x="20" y="30.4545">Organisational Justice</tspan></text>
<circle cx="24" cy="46" r="4" fill="#339E8C"/>
<text fill="#6B6B6B" font-size="10"><tspan x="34" y="49.6364">Colquitt, 2001</tspan></text>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="121.852" y="106.5">&#34;Am I treated fairly here?&#34;</tspan></text>
<rect x="28.5" y="122.5" width="155" height="63" rx="5.5" fill="#C7EDE6"/>
<rect x="28.5" y="122.5" width="155" height="63" rx="5.5" stroke="#339E8C"/>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="74.5576" y="144.5">Distributive</tspan></text>
<text fill="black" font-size="10"><tspan x="70.2725" y="159.636">Fair Outcomes:&#10;</tspan><tspan x="49.0225" y="171.636">pay, reward, recognition</tspan></text>
<rect x="196.5" y="122.5" width="155" height="63" rx="5.5" fill="#C7EDE6"/>
<rect x="196.5" y="122.5" width="155" height="63" rx="5.5" stroke="#339E8C"/>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="244.668" y="144.5">Procedural</tspan></text>
<text fill="black" font-size="10"><tspan x="243.556" y="159.636">Fair Process:&#10;</tspan><tspan x="210.65" y="171.636">voice, consistency, no bias</tspan></text>
<rect x="28.5" y="198.5" width="155" height="63" rx="5.5" fill="#C7EDE6"/>
<rect x="28.5" y="198.5" width="155" height="63" rx="5.5" stroke="#339E8C"/>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="69.8042" y="220.5">Interpersonal</tspan></text>
<text fill="black" font-size="10"><tspan x="70.1748" y="235.636">Fair Treatment:&#10;</tspan><tspan x="60.4238" y="247.636">dignity and respect</tspan></text>
<rect x="196.5" y="198.5" width="155" height="63" rx="5.5" fill="#C7EDE6"/>
<rect x="196.5" y="198.5" width="155" height="63" rx="5.5" stroke="#339E8C"/>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="238.073" y="220.5">Informational</tspan></text>
<text fill="black" font-size="10"><tspan x="235.025" y="235.636">Fair Explanation:&#10;</tspan><tspan x="212.647" y="247.636">honest, adequate reasons</tspan></text>
<text fill="black" font-size="10" font-style="italic"><tspan x="20" y="69.6364">Fairness of process, treatment and explanation matter more than the </tspan><tspan x="20" y="81.6364">outcome itself.</tspan></text>
</svg>
