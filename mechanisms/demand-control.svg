<svg viewBox="0 92 380 179" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:Inter,Helvetica,Arial,sans-serif}</style>
<rect width="380" height="300" rx="10" fill="white"/>
<text fill="black" font-size="15" font-weight="bold"><tspan x="20" y="28.4545">Demand-Control Model</tspan></text>
<circle cx="24" cy="44" r="4" fill="#339E8C"/>
<text fill="#6B6B6B" font-size="10"><tspan x="32" y="47.6364">Karasek, 1979</tspan></text>
<text fill="#595959" font-size="9" font-style="italic"><tspan x="20" y="62.7727">Strain comes from demands combined with low discretion; high demands with </tspan><tspan x="20" y="73.7727">high control is active, not harmful.</tspan></text>
<rect x="77.5" y="102" width="110" height="68" rx="4" fill="#FADEDE"/>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="111.741" y="134.5">Passive</tspan></text>
<text fill="#21293B" font-size="8"><tspan x="86.4414" y="145.909">low demand, low control</tspan></text>
<rect x="191.5" y="102" width="110" height="68" rx="4" fill="#C7EDE6"/>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="229.248" y="134.5">Active</tspan></text>
<text fill="#21293B" font-size="8"><tspan x="197.238" y="145.909">high demand, high control</tspan></text>
<rect x="77.5" y="174" width="110" height="68" rx="4" fill="#ED998C"/>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="103.211" y="206.5">High strain</tspan></text>
<text fill="#21293B" font-size="8"><tspan x="84.8398" y="217.909">high demand, low control</tspan></text>
<rect x="191.5" y="174" width="110" height="68" rx="4" fill="#9EDED1"/>
<text fill="#21293B" font-size="11" font-weight="bold"><tspan x="218.629" y="206.5">Low strain</tspan></text>
<text fill="#21293B" font-size="8"><tspan x="198.84" y="217.909">low demand, high control</tspan></text>
<text fill="#21293B" font-size="9" font-weight="bold"><tspan x="140.046" y="259.424">Control / discretion &#x2192;</tspan></text>
<text transform="matrix(0 -1 1 0 56.5 196)" fill="#21293B" font-size="9" font-weight="bold"><tspan x="0" y="8.77273">Demands &#x2192;</tspan></text>
</svg>
